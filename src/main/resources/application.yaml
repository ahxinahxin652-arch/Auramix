server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: Auramix
  # ============================ 文件上传 ============================
  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 30MB
  # ============================ 数据源 ============================
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: AuramixHikariCP
  # ============================ 邮件 ============================
  mail:
    host: smtp.163.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
            required: true
  # ============================ Redis ============================
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 5s

  # ============================ Spring AI (通义千问) ============================
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      model: qwen-plus
      chat:
        options:
          # 审核任务追求一致性，降低随机性；维度/裁决 agent 共用此默认值
          temperature: 0.1

  # ============================ Jackson ============================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ============================ MyBatis-Plus ============================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      # 雪花算法生成 64 位整型主键
      id-type: ASSIGN_ID
      table-underline: true
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.son.auramix.entity

# ============================ 日志 ============================
logging:
  level:
    root: info
    com.son.auramix: debug
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %m%n"

# ============================ 阿里云 OSS ============================
aliyun:
  oss:
    # 地域节点 (例: oss-cn-hangzhou.aliyuncs.com)
    endpoint: ${ALIYUN_OSS_ENDPOINT}
    # AccessKey ID (建议通过环境变量注入)
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    # AccessKey Secret
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    # Bucket 名称
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME}

# ============================ Admin / User Token ============================
auramix:
  admin:
    bootstrap:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD}
    token:
      # 管理员 token 7 天滑动过期
      ttl-seconds: 604800
  user:
    token:
      # 用户 token 30 天滑动过期
      ttl-seconds: 2592000
  # 内部 API Key — 用于桌面端 Express Server → Java 后端之间的服务间调用
  # 桌面端通过 X-Internal-Api-Key 请求头传递此密钥，绕过 Admin JWT 认证
  internal-api-key: ${INTERNAL_API_KEY}
  # Python 脚本路径
  audio:
    script-path: E:\Auramix\backend\auramix\scripts\audio_analyzer.py
