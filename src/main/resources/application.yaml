server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: Auramix
  # ============================ 数据源 ============================
  datasource:
    url: jdbc:mysql://localhost:3306/auramix?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: AuramixHikariCP

  # ============================ Redis ============================
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 5s

  # ============================ Jackson ============================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ============================ MyBatis-Plus ============================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 雪花算法生成 64 位整型主键
      id-type: ASSIGN_ID
      table-underline: true
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.son.auramix.entity

# ============================ 日志 ============================
logging:
  level:
    root: info
    com.son.auramix: debug
    com.son.auramix.mapper: debug
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %m%n"

# ============================ 阿里云 OSS ============================
aliyun:
  oss:
    # 地域节点 (例: oss-cn-hangzhou.aliyuncs.com)
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    # AccessKey ID (建议通过环境变量注入)
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    # AccessKey Secret
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    # Bucket 名称
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
    # 自定义域名(CDN加速域名)，选填
    custom-domain: ${ALIYUN_OSS_CUSTOM_DOMAIN:}
    # 签名URL默认过期时间(秒)，默认 3600
    signed-url-expire-seconds: 3600

# ============================ 邮件 ============================
spring:
  mail:
    host: ${SMTP_HOST:smtp.qq.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
            required: true

# ============================ Admin / User Token ============================
auramix:
  admin:
    bootstrap:
      username: admin
      password: ${AURAMIX_ADMIN_BOOTSTRAP_PASSWORD:}
    token:
      # 管理员 token 2 小时滑动过期
      ttl-seconds: 7200
  user:
    token:
      # 用户 token 30 天滑动过期
      ttl-seconds: 2592000
