server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: Auramix
  # ============================ 数据源 ============================
  datasource:
    url: jdbc:mysql://localhost:3306/auramix?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: AuramixHikariCP

  # ============================ Redis ============================
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 5s

  # ============================ Jackson ============================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ============================ MyBatis-Plus ============================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 雪花算法生成 64 位整型主键
      id-type: ASSIGN_ID
      table-underline: true
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.son.auramix.entity

# ============================ 日志 ============================
logging:
  level:
    root: info
    com.son.auramix: debug
    com.son.auramix.mapper: debug
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %m%n"

# ============================ Admin ============================
auramix:
  admin:
    bootstrap:
      # 初始管理员用户名
      username: admin
      # 留空时启动随机生成 12 位密码并打印一次；生产请通过环境变量注入
      password: ${AURAMIX_ADMIN_BOOTSTRAP_PASSWORD:}
    token:
      # 2 小时滑动过期
      ttl-seconds: 7200
